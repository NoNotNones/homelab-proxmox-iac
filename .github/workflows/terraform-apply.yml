name: Terraform Apply

on:
  push:
    branches:
      - main

jobs:
  apply:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
